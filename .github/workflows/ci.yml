name: AIVEDIO CI
on:
  push:
    branches: [main, feature/phase1-foundation]
  pull_request:
  workflow_dispatch:
concurrency:
  group: aivedio-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aivedio
          POSTGRES_PASSWORD: aivedio_ci
          POSTGRES_DB: aivedio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aivedio -d aivedio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aivedio:aivedio_ci@localhost:5432/aivedio_test
      AIVEDIO_SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      AIVEDIO_BOOTSTRAP_ADMIN_KEY: ci-bootstrap-key-at-least-32-characters-long
      AIVEDIO_ALLOW_SELF_REGISTRATION: "true"
      AIVEDIO_E2E_PORT: 3419
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Core creative-plan duration regression tests
        run: pnpm --filter @aivedio/api exec tsx --test ../../packages/core/tests/creative-director.test.ts
      - name: Build
        run: pnpm build
      - name: Build API container
        run: docker build -f Dockerfile.api -t aivedio-api-ci .
      - name: API container runtime health smoke
        run: |
          set -euo pipefail
          container_name="aivedio-api-smoke"
          cleanup() {
            docker logs "$container_name" || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$container_name" -p 127.0.0.1:3419:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e AIVEDIO_SESSION_SECRET=ci-session-secret-at-least-32-characters-long \
            -e AIVEDIO_ALLOWED_ORIGINS=https://aivedio.streamlit.app \
            aivedio-api-ci
          for i in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3419/health; then
              echo "API container health smoke passed"
              exit 0
            fi
            sleep 2
          done
          echo "API container did not become healthy within 60 seconds" >&2
          exit 1
      - name: Apply migrations to disposable CI database
        run: pnpm --filter @aivedio/api test:migrate
      - name: Agent output validation tests
        run: pnpm --filter @aivedio/api test:agents
      - name: Authentication security tests
        run: pnpm --filter @aivedio/api test:security
      - name: API production workflow E2E smoke
        run: pnpm --filter @aivedio/api test:e2e
      - name: FastAPI adapter tests
        run: |
          python -m pip install -e "apps/fastapi-adapter[test]"
          python -m pytest -q apps/fastapi-adapter/tests
      - name: FastAPI adapter syntax check
        run: python -m compileall -q apps/fastapi-adapter/app apps/fastapi-adapter/tests
      - name: Python LangGraph service tests
        run: |
          python -m pip install -e "apps/python-api[test]"
          cd apps/python-api
          python -m pytest -q
          python -m compileall -q app tests
      - name: Python syntax check
        run: python -m compileall -q apps/streamlit apps/asset-worker apps/audio-worker apps/qa-worker
      - name: Check Python worker requirements
        run: |
          python -m pip install --dry-run -r apps/streamlit/requirements.txt
          python -m pip install --dry-run -r apps/asset-worker/requirements.txt
          python -m pip install --dry-run -r apps/audio-worker/requirements.txt
          python -m pip install --dry-run -r apps/qa-worker/requirements.txt
