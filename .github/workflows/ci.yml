name: AIVEDIO CI
on:
  push:
    branches: [main, feature/phase1-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Python syntax check
        run: |
          python -m compileall -q apps/streamlit apps/audio-worker apps/qa-worker
      - name: Check Streamlit requirements
        run: |
          python -m pip install --dry-run -r apps/streamlit/requirements.txt
